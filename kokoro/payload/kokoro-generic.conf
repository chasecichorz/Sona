# Kokoro neural TTS for speech-dispatcher (sd_generic).
# Engine: /opt/kokoro-speechd (kokoro-onnx + Kokoro-82M v1.0 model).
# /usr/local/bin/kokoro-speak keeps a helper loaded per user; it exits
# after 20 minutes of silence.

GenericExecuteSynth "printf '%s' '$DATA' | /usr/local/bin/kokoro-speak '$VOICE' $RATE $VOLUME"
GenericCmdDependency "kokoro-speak"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Hand whole messages to the helper; it splits sentences and streams them.
GenericMaxChunkLength 4000
GenericDelimiters ""

# $RATE and $VOLUME arrive as -100..100 (kokoro-speak maps them).
GenericRateAdd 0
GenericRateMultiply 100
GenericRateForceInteger 1
GenericVolumeAdd 0
GenericVolumeMultiply 100
GenericVolumeForceInteger 1
GenericPitchAdd 0
GenericPitchMultiply 100
GenericPitchForceInteger 1

GenericLanguage "en" "en-us" "utf-8"
GenericLanguage "en-US" "en-us" "utf-8"
GenericLanguage "en-GB" "en-gb" "utf-8"
GenericDefaultCharset "utf-8"

# Main voices on the standard voice types
AddVoice "en-US" "FEMALE1" "af_heart"
AddVoice "en-US" "FEMALE2" "af_bella"
AddVoice "en-GB" "FEMALE3" "bf_emma"
AddVoice "en-US" "MALE1"   "am_michael"
AddVoice "en-US" "MALE2"   "am_fenrir"
AddVoice "en-GB" "MALE3"   "bm_george"
