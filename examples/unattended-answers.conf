# Sona Linux unattended install answers.
#
# Use:  sona-install --unattended this-file.conf
#
# One KEY=value per line. Lines starting with # are comments. Quotes around
# values are optional. Anything not set uses the default shown.
# This file holds passwords: keep it private and delete it after use.

# --- Disk (required) -------------------------------------------------------
# The drive to install to, for example /dev/sda or /dev/nvme0n1.
# "auto" is allowed only when the computer has exactly one drive.
DISK=auto

# erase     wipe the whole drive (default)
# existing  install onto ROOT_PART, keeping other partitions (dual-boot)
PART_MODE=erase

# Must be yes, or the installer refuses to touch the disk.
CONFIRM_ERASE=no

# Only for PART_MODE=existing:
#ROOT_PART=/dev/nvme0n1p5
# Only needed when there is more than one EFI partition:
#EFI_PART=/dev/nvme0n1p1

# --- User (PASSWORD is required) --------------------------------------------
FULLNAME=Sona User
USERNAME=sona
PASSWORD=
# Defaults to PASSWORD.
#ROOT_PASSWORD=
AUTOLOGIN=yes
# Windows XP sounds, AutoPlay and shortcuts (default yes; the sounds are
# downloaded from archive.org at first login).
XP_THEME=yes

# --- System ----------------------------------------------------------------
HOSTNAME=sona-pc
TIMEZONE=America/Chicago
LANG_LOCALE=en_US.UTF-8
CONSOLE_KEYMAP=us
X11_KEYBOARD=us

# --- Network ---------------------------------------------------------------
# Leave blank for a wired connection.
WIFI_SSID=
WIFI_PASS=

# --- Extras ----------------------------------------------------------------
# AUR packages: Google Chrome, Pamac, Thorium Reader, LIOS and more.
INSTALL_AUR=yes
# Send boot messages to the serial port too (for testing in virtual machines).
SERIAL_CONSOLE=no
# What to do when finished: reboot, poweroff, or none.
FINISH=reboot
