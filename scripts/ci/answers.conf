# Answers for the automated install test in GitHub Actions.
# The test virtual machine has one blank disk, so DISK=auto is safe.
DISK=auto
PART_MODE=erase
CONFIRM_ERASE=yes
FULLNAME=Sona CI Test
USERNAME=tester
PASSWORD=sona-ci-test
HOSTNAME=sona-ci
TIMEZONE=UTC
LANG_LOCALE=en_US.UTF-8
CONSOLE_KEYMAP=us
X11_KEYBOARD=us
AUTOLOGIN=yes
# The XP theme downloads sounds at first login; not part of this test.
XP_THEME=no
# Building AUR packages (Chrome and others) adds a long time and tests
# third-party packages rather than Sona.
INSTALL_AUR=no
SERIAL_CONSOLE=yes
FINISH=none
